<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111827;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}a{color:#2443F5;text-decoration:none}a:hover{color:#1A34D6}</style>
</helmet>
<aside style="flex:1;height:100%;width:248px;box-sizing:border-box;padding:24px 16px 16px;display:flex;flex-direction:column;gap:20px;background:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:28px;height:28px;border-radius:9px;background:#2443F5;color:#fff;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:18px;line-height:1;font-variation-settings:'FILL' 1">where_to_vote</span></div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.04em;color:#111827">adone</div>
    </div>
    <div style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#6B7280"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">left_panel_close</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#F5F6F8">
    <div style="width:36px;height:36px;border-radius:10px;background:#0B1B4F;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px">M</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:11px;color:#9CA3AF;font-weight:500">Ishxona</div>
      <div style="font-size:14px;font-weight:700">Mudom bozor</div>
    </div>
    <span style="font-family:'Material Symbols Rounded';font-size:18px;line-height:1;color:#6B7280">unfold_more</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;color:#9CA3AF;padding:0 12px 6px">MENYU</div>
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
      <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:999px;background:#F2F4F7;box-shadow:0 1px 2px rgba(16,24,40,.05)">
          <span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;color:#2443F5">{{ it.icon }}</span>
          <span style="flex:1;font-size:14px;font-weight:700;color:#2443F5">{{ it.label }}</span>
          <sc-if value="{{ it.count }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#2443F5;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ it.count }}</span></sc-if>
          <span style="font-family:'Material Symbols Rounded';font-size:18px;line-height:1;color:#111827">chevron_right</span>
        </div>
      </sc-if>
      <sc-if value="{{ it.inactive }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:999px;color:#4B5563" style-hover="background:#F7F8FA">
          <span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;color:#6B7280">{{ it.icon }}</span>
          <span style="flex:1;font-size:14px;font-weight:500">{{ it.label }}</span>
          <sc-if value="{{ it.count }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#EEF1FF;color:#2443F5;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ it.count }}</span></sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
    <div style="padding:14px;border-radius:16px;background:#F5F7FF;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:#6B7280;font-weight:500">Tarif · Biznes</span>
        <span style="font-size:13px;font-weight:700">48 / 50 xodim</span>
      </div>
      <div style="height:6px;border-radius:999px;background:#DDE3FF;overflow:hidden"><div style="width:96%;height:100%;border-radius:999px;background:#2443F5"></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 4px 0">
      <div style="position:relative;width:40px;height:40px;border-radius:999px;background:#FDE7D3;color:#9A4B12;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">AK<span style="position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:999px;background:#16A34A;border:2px solid #fff"></span></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700">Aziz Karimov</div>
        <div style="font-size:12px;color:#6B7280">+998 90 123 45 67</div>
      </div>
      <div style="width:28px;height:28px;border-radius:8px;border:1px solid #ECEEF2;display:flex;align-items:center;justify-content:center;color:#6B7280"><span style="font-family:'Material Symbols Rounded';font-size:16px;line-height:1">chevron_right</span></div>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Bosh sahifa&quot;,&quot;Davomat&quot;,&quot;Vazifalar&quot;,&quot;So'rovlar&quot;,&quot;Xodimlar&quot;,&quot;Jadvallar&quot;,&quot;Filiallar&quot;,&quot;Hisobotlar&quot;,&quot;Ish haqi&quot;,&quot;Sozlamalar&quot;],&quot;default&quot;:&quot;Bosh sahifa&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Bosh sahifa';
    const all = [
      ['Bosh sahifa','grid_view'],['Davomat','how_to_reg'],['Vazifalar','task_alt',3],["So'rovlar",'inbox',2],
      ['Xodimlar','group'],['Jadvallar','calendar_month'],['Filiallar','location_on'],['Hisobotlar','bar_chart'],
      ['Ish haqi','payments'],['Sozlamalar','settings']
    ];
    return { items: all.map(([label, icon, count]) => ({ label, icon, count, active: label === active, inactive: label !== active })) };
  }
}
</script>
</body>
</html>
